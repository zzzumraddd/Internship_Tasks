apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
# ---------------- Redis ----------------
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: demo-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: demo-app}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
# ---------------- API (Flask + Prometheus metrics) ----------------
apiVersion: v1
kind: ConfigMap
metadata: {name: api-code, namespace: demo-app}
data:
  app.py: |
    import os, random, time
    import redis
    from flask import Flask
    from prometheus_client import Counter, Histogram, make_wsgi_app
    from werkzeug.middleware.dispatcher import DispatcherMiddleware

    app = Flask(__name__)
    db = redis.Redis(host="redis", port=6379, decode_responses=True)
    POD = os.uname().nodename

    REQUESTS = Counter("app_requests", "HTTP requests", ["endpoint", "status"])
    LATENCY = Histogram("app_request_duration_seconds", "Request latency", ["endpoint"])

    @app.route("/")
    def index():
        with LATENCY.labels("/").time():
            visits = db.incr("visits")
        REQUESTS.labels("/", "200").inc()
        return f"Hello from pod {POD}! Total visits: {visits}\n"

    @app.route("/slow")
    def slow():
        with LATENCY.labels("/slow").time():
            delay = random.uniform(0.5, 2.0)
            time.sleep(delay)
        REQUESTS.labels("/slow", "200").inc()
        return f"Slow response from {POD} ({delay:.2f}s)\n"

    @app.route("/error")
    def error():
        REQUESTS.labels("/error", "500").inc()
        return f"Something went wrong on {POD}\n", 500

    # /metrics endpoint for Prometheus
    app.wsgi_app = DispatcherMiddleware(app.wsgi_app, {"/metrics": make_wsgi_app()})

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000, threaded=True)
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: demo-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh", "-c", "pip install -q flask redis prometheus_client && python /code/app.py"]
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /metrics, port: http}
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts: [{name: code, mountPath: /code}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: code
          configMap: {name: api-code}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo-app
  labels: {app: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 5000, targetPort: http}]
---
# ---------------- Frontend (nginx) ----------------
apiVersion: v1
kind: ConfigMap
metadata: {name: frontend, namespace: demo-app}
data:
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; index index.html; }
      location /api/ { proxy_pass http://api:5000/; }
    }
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Demo App</title>
    <style>body{font-family:sans-serif;max-width:600px;margin:40px auto}
    button{padding:10px 16px;margin:4px;font-size:15px}
    pre{background:#f3f3f3;padding:12px;min-height:120px}</style></head>
    <body>
      <h2>Kubernetes Demo App</h2>
      <button onclick="call('')">Visit</button>
      <button onclick="call('slow')">Slow request</button>
      <button onclick="call('error')">Error</button>
      <button onclick="burst()">Send 50 visits</button>
      <pre id="out"></pre>
      <script>
        const out = document.getElementById('out');
        async function call(p){
          const r = await fetch('/api/' + p);
          out.textContent = r.status + ' ' + await r.text() + out.textContent;
        }
        async function burst(){ for(let i=0;i<50;i++) call(''); }
      </script>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: demo-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: cfg, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: cfg, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: cfg
          configMap: {name: frontend}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: demo-app}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 80, nodePort: 30080}]
