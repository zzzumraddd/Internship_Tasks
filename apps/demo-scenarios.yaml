apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# ---------- 1. Python app with custom /metrics ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-app
  namespace: demo
data:
  app.py: |
    import random, time
    from prometheus_client import Counter, Histogram, Gauge, start_http_server
    JOBS = Counter("demo_jobs_processed", "Jobs processed", ["status"])
    DURATION = Histogram("demo_job_duration_seconds", "Time spent per job")
    QUEUE = Gauge("demo_queue_size", "Jobs waiting in queue")
    start_http_server(8000)
    print("serving metrics on :8000/metrics", flush=True)
    while True:
        QUEUE.set(random.randint(0, 50))
        with DURATION.time():
            time.sleep(random.uniform(0.05, 0.8))
        JOBS.labels(status="error" if random.random() < 0.1 else "ok").inc()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: metrics-app}
  template:
    metadata:
      labels: {app: metrics-app}
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh", "-c", "pip install -q prometheus_client && python /app/app.py"]
          ports:
            - name: metrics
              containerPort: 8000
          volumeMounts:
            - {name: code, mountPath: /app}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: code
          configMap: {name: metrics-app}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-app
  namespace: demo
  labels: {app: metrics-app}
spec:
  selector: {app: metrics-app}
  ports:
    - {name: metrics, port: 8000, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-app
  namespace: demo
  labels: {release: kps}          # required for kube-prometheus-stack to pick it up
spec:
  selector:
    matchLabels: {app: metrics-app}
  endpoints:
    - {port: metrics, interval: 15s}
---
# ---------- 2. Web server + load generator (network traffic) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web; done"]
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
# ---------- 3. CPU burner (high CPU + throttling) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-burner}
  template:
    metadata:
      labels: {app: cpu-burner}
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: {cpu: 100m, memory: 16Mi}
            limits: {cpu: 300m, memory: 32Mi}
---
# ---------- 4. Memory leak (grows until OOMKilled, then restarts) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-leak
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: memory-leak}
  template:
    metadata:
      labels: {app: memory-leak}
    spec:
      containers:
        - name: leak
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import time
              data = []
              while True:
                  data.append("x" * 10_000_000)
                  print(f"allocated ~{len(data) * 10} MB", flush=True)
                  time.sleep(2)
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 150Mi}
---
# ---------- 5. Crash loop (exits with error every 30s) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: crash-loop}
  template:
    metadata:
      labels: {app: crash-loop}
    spec:
      containers:
        - name: crash
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 30; echo 'fatal error'; exit 1"]
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
---
# ---------- 6. Unschedulable pod (stays Pending) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: too-big
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: too-big}
  template:
    metadata:
      labels: {app: too-big}
    spec:
      containers:
        - name: big
          image: nginx:1.27-alpine
          resources:
            requests: {cpu: 100m, memory: 100Gi}
