apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-nginx
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
          chatid: "$TELEGRAM_CHAT_ID"
          parse_mode: ""
          message: '{{ template "default.message" . }}'
