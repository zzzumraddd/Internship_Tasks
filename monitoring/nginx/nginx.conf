worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format access_json escape=json
        '{"status":"$status","method":"$request_method","uri":"$request_uri"}';
    access_log /dev/stdout access_json;
    server {
        listen 8080;
        location = / { return 200 "nginx log demo\n"; }
        location = /error { return 500 "demo server error\n"; }
        location / { return 404 "not found\n"; }
    }
}
