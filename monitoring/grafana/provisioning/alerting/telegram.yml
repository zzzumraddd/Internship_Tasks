apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-nginx
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
          chatid: "__TELEGRAM_CHAT_ID__"
          parse_mode: None
          message: '{{ template "default.message" . }}'
